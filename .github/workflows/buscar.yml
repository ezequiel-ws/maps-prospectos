name: Buscar prospectos

"on":
  workflow_dispatch:
    inputs:
      busqueda:
        description: "Consulta(s). Varias separadas por ; (ej. peluquerías en CABA; odontólogos en Morón)"
        required: true
        type: string
      min_rating:
        description: "Rating mínimo"
        required: false
        default: "4.0"
        type: string
      min_resenas:
        description: "Cantidad mínima de reseñas"
        required: false
        default: "10"
        type: string
      profundidad:
        description: "Profundidad del scraper (-depth)"
        required: false
        default: "1"
        type: string

concurrency:
  group: buscar-prospectos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape y filtrar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpetas y queries.txt
        run: |
          mkdir -p output final
          # Una query por línea; ';' separa varias
          printf '%s\n' "${{ inputs.busqueda }}" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > queries.txt
          echo "Queries:"
          cat -n queries.txt

      - name: Correr google-maps-scraper (Docker)
        env:
          DISABLE_TELEMETRY: "1"
          DEPTH: ${{ inputs.profundidad }}
        run: |
          docker pull gosom/google-maps-scraper
          docker run --rm \
            -e DISABLE_TELEMETRY=1 \
            -v "$PWD:/work" \
            -w /work \
            gosom/google-maps-scraper \
            -input /work/queries.txt \
            -results /work/output/raw.csv \
            -c 2 \
            -depth "${DEPTH}" \
            -lang es \
            -exit-on-inactivity 3m
          ls -la output/
          test -f output/raw.csv

      - name: Filtrar prospectos (sin web + buenas reseñas)
        run: |
          python3 filtrar.py output/raw.csv final/limpio.csv \
            --min-rating "${{ inputs.min_rating }}" \
            --min-reviews "${{ inputs.min_resenas }}" \
            --modo or
          ls -la final/

      - name: Resumen en Step Summary
        run: |
          python3 << 'PY'
          import csv
          from pathlib import Path

          limpio = Path("final/limpio.csv")
          raw = Path("output/raw.csv")
          n_raw = 0
          if raw.is_file():
              with raw.open(encoding="utf-8-sig", newline="") as f:
                  n_raw = sum(1 for _ in csv.DictReader(f))

          rows = []
          if limpio.is_file():
              with limpio.open(encoding="utf-8", newline="") as f:
                  rows = list(csv.DictReader(f))

          lines = []
          lines.append("## Resultado")
          lines.append("")
          lines.append(f"- Filas crudas: **{n_raw}**")
          lines.append(f"- Prospectos limpios (sin web + filtro): **{len(rows)}**")
          lines.append("")
          lines.append("### Top 10")
          lines.append("")
          lines.append("| # | nombre | reseñas | rating | whatsapp |")
          lines.append("|---|--------|---------|--------|----------|")
          for i, r in enumerate(rows[:10], 1):
              nombre = (r.get("nombre") or "").replace("|", "/")
              reseñas = r.get("reseñas") or ""
              rating = r.get("rating") or ""
              wa = r.get("whatsapp") or ""
              if wa:
                  wa = f"[wa.me]({wa})"
              lines.append(f"| {i} | {nombre} | {reseñas} | {rating} | {wa} |")
          if not rows:
              lines.append("| — | (sin resultados) | | | |")

          summary = "\n".join(lines) + "\n"
          print(summary)
          path = Path.home()  # unused; write to GITHUB_STEP_SUMMARY
          import os
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          if out:
              with open(out, "a", encoding="utf-8") as f:
                  f.write(summary)
          PY

      - name: Subir artifact prospectos
        uses: actions/upload-artifact@v4
        with:
          name: prospectos
          path: |
            output/raw.csv
            final/limpio.csv
          if-no-files-found: error
          retention-days: 14
