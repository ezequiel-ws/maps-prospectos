name: Buscar prospectos

"on":
  workflow_dispatch:
    inputs:
      busqueda:
        description: "Consulta(s). Varias separadas por ; (ej. peluquerías en CABA; odontólogos en Morón)"
        required: true
        type: string
      expandir:
        description: "Expandir zonas amplias (CABA→48 barrios, zona norte/oeste/sur, GBA)"
        required: false
        default: true
        type: boolean
      min_rating:
        description: "Rating mínimo"
        required: false
        default: "4.0"
        type: string
      min_resenas:
        description: "Cantidad mínima de reseñas"
        required: false
        default: "10"
        type: string
      profundidad:
        description: "Profundidad del scraper (-depth). Más alto = más resultados"
        required: false
        default: "5"
        type: string

concurrency:
  group: buscar-prospectos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape y filtrar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar carpetas y queries
        env:
          BUSQUEDA: ${{ inputs.busqueda }}
          EXPANDIR: ${{ inputs.expandir }}
        run: |
          mkdir -p output final docs/data
          printf '%s\n' "$BUSQUEDA" | tr ';' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' > queries_raw.txt
          echo "Queries originales:"
          cat -n queries_raw.txt
          if [ "$EXPANDIR" = "true" ]; then
            python3 expandir.py queries_raw.txt queries.txt
          else
            python3 expandir.py queries_raw.txt queries.txt --no-expand
          fi
          echo "Queries finales:"
          cat -n queries.txt
          wc -l queries.txt

      - name: Correr google-maps-scraper (Docker)
        env:
          DISABLE_TELEMETRY: "1"
          DEPTH: ${{ inputs.profundidad }}
        run: |
          docker pull gosom/google-maps-scraper
          docker run --rm \
            -e DISABLE_TELEMETRY=1 \
            -v "$PWD:/work" \
            -w /work \
            gosom/google-maps-scraper \
            -input /work/queries.txt \
            -results /work/output/raw.csv \
            -c 4 \
            -depth "${DEPTH}" \
            -lang es \
            -exit-on-inactivity 3m
          ls -la output/
          test -f output/raw.csv

      - name: Filtrar prospectos (sin web + buenas reseñas + dedupe)
        run: |
          python3 filtrar.py output/raw.csv final/limpio.csv \
            --min-rating "${{ inputs.min_rating }}" \
            --min-reviews "${{ inputs.min_resenas }}" \
            --modo or
          ls -la final/

      - name: Resumen mobile + JSON para Pages
        env:
          BUSQUEDA: ${{ inputs.busqueda }}
        run: |
          python3 resumen.py \
            --limpio final/limpio.csv \
            --raw output/raw.csv \
            --query "$BUSQUEDA" \
            --json-dir docs/data \
            --max-items 100

      - name: Publicar en GitHub Pages (commit docs/data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/data"
          else
            git commit -m "prospectos: $(date -u +%Y-%m-%dT%H:%MZ) — ${{ inputs.busqueda }}"
            git push
          fi

      - name: Subir artifact prospectos
        uses: actions/upload-artifact@v4
        with:
          name: prospectos
          path: |
            output/raw.csv
            final/limpio.csv
            queries.txt
          if-no-files-found: error
          retention-days: 14
